
name: Build GenPlusGX Wii

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:20240530

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build GenPlusGX
        shell: bash
        run: |
          set -euxo pipefail
          make -f Makefile.wii -j2
          test -f genplus_wii.dol

      - name: Package Wii app
        shell: bash
        run: |
          mkdir -p dist/apps/genplus
          cp genplus_wii.dol dist/apps/genplus/boot.dol
          sha256sum dist/apps/genplus/boot.dol > dist/SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: GenPlusGX-Wii
          path: dist/
